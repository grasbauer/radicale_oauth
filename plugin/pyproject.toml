[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radicale-oauth2-hybrid"
version = "0.1.0"
description = "Hybrid auth for Radicale: IMAP for DAV clients, X-Remote-User for the web UI."
requires-python = ">=3.9"
dependencies = ["Radicale>=3.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["radicale_oauth2_hybrid*"]
